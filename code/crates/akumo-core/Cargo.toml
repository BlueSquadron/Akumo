[package]
name = "akumo-core"
description = "Akumo domain services (the provider-agnostic unified loop). Depends only on akumo-domain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
akumo-domain = { workspace = true }
akumo-dsl = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# Adapters used only to test the full loop (dev-only; the dep-lint ignores dev-dependencies, so the
# provider-blind guarantee for the shipped core is preserved).
akumo-provider-mock = { workspace = true }
akumo-ledger = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
