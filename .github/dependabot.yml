version: 2
updates:
  # Rust dependencies (the Cargo workspace lives under code/).
  - package-ecosystem: cargo
    directory: /code
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns: ["aws-*"]

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
