name: Release

# Builds the single static binary for each target, checksums and signs the artifacts, publishes a
# container image, and attaches everything to the GitHub release (ADR-0003 / task G20.1). Runs on a
# published release or manual dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # attach release assets
  packages: write # push container image
  id-token: write # keyless signing (cosign / OIDC)

jobs:
  binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: macos-latest,   target: aarch64-apple-darwin }
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools (linux)
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --bin akumo --target ${{ matrix.target }}

      - name: Package + checksum
        run: |
          bin="target/${{ matrix.target }}/release/akumo"
          out="akumo-${{ matrix.target }}"
          tar -C "$(dirname "$bin")" -czf "${out}.tar.gz" akumo
          shasum -a 256 "${out}.tar.gz" > "${out}.tar.gz.sha256"

      # Keyless signing of the artifacts (cosign + OIDC). Verifiers use the release's identity.
      - name: Sign artifacts
        uses: sigstore/cosign-installer@v3
      - run: cosign sign-blob --yes "code/akumo-${{ matrix.target }}.tar.gz" --output-signature "code/akumo-${{ matrix.target }}.tar.gz.sig"
        working-directory: .

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            code/akumo-${{ matrix.target }}.tar.gz
            code/akumo-${{ matrix.target }}.tar.gz.sha256
            code/akumo-${{ matrix.target }}.tar.gz.sig

  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'release' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

# Homebrew: a formula in a `homebrew-akumo` tap points at the signed release tarballs above. Update
# it from this workflow (or the tap's own CI) once the release assets are published.
